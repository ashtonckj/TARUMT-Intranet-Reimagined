	<script>
	function submitLogin(){
				
		var username = document.loginForm.username.value;	
		var password = document.loginForm.password.value;		
				
		if(username=="")
			document.loginForm.username.focus();
		else if(password=="")
			document.loginForm.password.focus();
		else
			document.loginForm.submit();		
	}
	
	function submitResetPwd(){
				
		var txtsid = document.getElementById("txtsid").value;	
		var txtIc  = document.getElementById("txtIc").value;	
				
		if(txtsid=="")
			document.getElementById("txtsid").focus();
		else if(txtIc=="")
			document.getElementById("txtIc").focus();
		else
			//document.getElementById("frm_resetPwd").submit();	
			retrieve();
	}
		
	function  GetEnter(evt){
		evt = (evt) ? evt : window.event;
		var charCode = (evt.which) ? evt.which : evt.keyCode;
		
		if(charCode==13){ //Enter
			loginForm.submit();
			return false;
		}else
			return true;
	}

	</script>

		<script type="text/javascript">
		function retrieve(){
			var field1 = encodeURIComponent(rc4("12",document.getElementById("txtsid").value));
			var field2 = encodeURIComponent(rc4("12",document.getElementById("txtIc").value));
			var xmlhttp;
			if (window.XMLHttpRequest){// code for IE7+, Firefox, Chrome, Opera, Safari
			xmlhttp=new XMLHttpRequest();
			}
			else{// code for IE6, IE5
			xmlhttp=new ActiveXObject("Microsoft.XMLHTTP");
			}
			xmlhttp.onreadystatechange=function(){
				if (xmlhttp.readyState==4 && xmlhttp.status==200){
					document.getElementById("rtReturn").style.display="block";
				    document.getElementById("txthint").innerHTML=xmlhttp.responseText;
			    }
			  }
		xmlhttp.open("POST","https://web3.tarc.edu.my/v1/login/rc4test2b.asp",true);
		xmlhttp.setRequestHeader("Content-type","application/x-www-form-urlencoded");
		xmlhttp.send("param1="+field1+"&param2="+field2);
		}
		</script>
