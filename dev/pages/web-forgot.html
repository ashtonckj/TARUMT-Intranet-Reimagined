	}

		<script>
	function submitLogin(){
				
		var username = document.loginForm.username.value;	
		var password = document.loginForm.password.value;		
				
		if(username=="")
			document.loginForm.username.focus();
		else if(password=="")
			document.loginForm.password.focus();
		else
			document.loginForm.submit();		
	}
	
	function submitResetPwd(){
				
		var fuserid = document.getElementById("fuserid").value;	
		var fnicno  = document.getElementById("fnicno").value;	
				
		if(fuserid==""){
			document.getElementById("fuserid").focus();
			return false;
		}else if(fnicno==""){
			document.getElementById("fnicno").focus();
			return false;
		}else{
			document.getElementById("frm_resetPwd").submit();	
		}
	}
		
	function  GetEnter(evt){
		evt = (evt) ? evt : window.event;
		var charCode = (evt.which) ? evt.which : evt.keyCode;
		
		if(charCode==13){ //Enter
			loginForm.submit();
			return false;
		}else
			return true;
	}

	
	function  checkDecimal(evt){
	evt = (evt) ? evt : window.event;
	var charCode = (evt.which) ? evt.which : evt.keyCode;
	if (charCode > 47 && charCode < 58)
		return true;
	else if(charCode==13){ //Enter
		//forms.submit();
		return false;
	}else
		return false;
	}
	
	
	</script>
