<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TARUMT Intranet Beautifier settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="panel">
    <header class="top">
      <img src="../icons/icon48.png" alt="" width="32" height="32">
      <div class="title">
        <h1>Intranet Beautifier</h1>
        <p id="status" class="status" aria-live="polite">On for the TAR UMT intranet</p>
      </div>
      <label class="switch" title="Turn the new look on or off">
        <input type="checkbox" id="enabled" role="switch">
        <span class="track" aria-hidden="true"><span class="thumb"></span></span>
        <span class="sr-only">Use the new look</span>
      </label>
    </header>

    <div id="options" class="options">
      <fieldset class="group">
        <legend>Appearance</legend>
        <div class="segmented" role="radiogroup">
          <label>
            <input type="radio" name="theme" value="system">
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="13" rx="2"/><path d="M8 21h8M12 17v4"/></svg>System</span>
          </label>
          <label>
            <input type="radio" name="theme" value="light">
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Light</span>
          </label>
          <label>
            <input type="radio" name="theme" value="dark">
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4 8 8 0 1 0 20 14.5Z"/></svg>Dark</span>
          </label>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Accent colour</legend>
        <div class="swatches">
          <label class="swatch" style="--c: #1d5fd1"><input type="radio" name="accent" value="blue"><span></span><span class="sr-only">Blue</span></label>
          <label class="swatch" style="--c: #0f766e"><input type="radio" name="accent" value="teal"><span></span><span class="sr-only">Teal</span></label>
          <label class="swatch" style="--c: #6d28d9"><input type="radio" name="accent" value="violet"><span></span><span class="sr-only">Violet</span></label>
          <label class="swatch" style="--c: #be123c"><input type="radio" name="accent" value="rose"><span></span><span class="sr-only">Rose</span></label>
          <label class="swatch" style="--c: #15803d"><input type="radio" name="accent" value="green"><span></span><span class="sr-only">Green</span></label>
          <span id="accent-name" class="swatch-name" aria-hidden="true"></span>
        </div>
      </fieldset>

      <fieldset class="group">
        <legend>Comfort</legend>
        <label class="row">
          <span>
            <strong>Larger text</strong>
            <small>Bumps body text from 14 to 16 px</small>
          </span>
          <span class="switch">
            <input type="checkbox" id="largeText" role="switch">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </span>
        </label>
        <label class="row">
          <span>
            <strong>Seasonal login photo</strong>
            <small>Off shows a plain background instead</small>
          </span>
          <span class="switch">
            <input type="checkbox" id="loginBackground" role="switch">
            <span class="track" aria-hidden="true"><span class="thumb"></span></span>
          </span>
        </label>
      </fieldset>
    </div>

    <footer class="foot">
      <span>Changes apply instantly to open tabs.</span>
      <button type="button" id="reset" class="link">Reset</button>
    </footer>
  </main>

  <script src="../src/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
